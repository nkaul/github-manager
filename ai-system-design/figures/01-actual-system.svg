<text x="100" y="274" class="body" text-anchor="start">Trusted identity and repository data</text>
<text x="100" y="306" class="body" text-anchor="start">Public-source verification</text>
<text x="100" y="338" class="body" text-anchor="start">Credentials stay on the server</text>
</g>
<g data-card="FastAPI + durable local jobs"><rect x="645" y="190" width="510" height="205" rx="18" fill="#f3e5f5" stroke="#20213f" stroke-width="2.5"/>
<path d="M659 194 Q900.0 189 1140 194" fill="none" stroke="#673ab7" stroke-width="1" opacity=".35"/>
<text x="669" y="234" class="card-title" text-anchor="start">FastAPI + durable local jobs</text>
<text x="670" y="274" class="body" text-anchor="start">Owner-scoped session and CSRF</text>
<text x="670" y="306" class="body" text-anchor="start">Reviewed cohort → exact run plan</text>
<text x="670" y="338" class="body" text-anchor="start">One active organization run</text>
</g>
<g data-card="Next.js workspace"><rect x="1215" y="190" width="510" height="205" rx="18" fill="#e3f2fd" stroke="#20213f" stroke-width="2.5"/>
