<g data-card="GitHub + OAuth App"><rect x="75" y="190" width="510" height="205" rx="18" fill="#e3f2fd" stroke="#20213f" stroke-width="2.5"/>
<path d="M89 194 Q330.0 189 570 194" fill="none" stroke="#673ab7" stroke-width="1" opacity=".35"/>
