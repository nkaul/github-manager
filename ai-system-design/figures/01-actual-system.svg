<text x="1239" y="234" class="card-title" text-anchor="start">Next.js workspace</text>
<text x="1240" y="274" class="body" text-anchor="start">Browse Projects, Topics and Tags</text>
<text x="1240" y="306" class="body" text-anchor="start">Review drafts and suggestions</text>
<text x="1240" y="338" class="body" text-anchor="start">Manual mappings + explicit resets</text>
</g>
