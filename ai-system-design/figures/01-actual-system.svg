<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
<title id="title">From GitHub evidence to user-owned organization</title><desc id="desc">Implemented local app: three logical data areas in SQLite; AWS runtime remains a separate design.</desc>
