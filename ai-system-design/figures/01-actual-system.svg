<path d="M1155,290 L1215,290" fill="none" stroke="#3949ab" stroke-width="3" marker-end="url(#arrow)"/>
<g data-card="Core · authoritative metadata"><rect x="75" y="500" width="510" height="230" rx="18" fill="#e3f2fd" stroke="#20213f" stroke-width="2.5"/>
<path d="M89 504 Q330.0 499 570 504" fill="none" stroke="#673ab7" stroke-width="1" opacity=".35"/>
<text x="99" y="544" class="card-title" text-anchor="start">Core · authoritative metadata</text>
<text x="100" y="584" class="body" text-anchor="start">Stable GitHub IDs and URLs</text>
<text x="100" y="616" class="body" text-anchor="start">Inventory, access and activity</text>
<text x="100" y="648" class="body" text-anchor="start">Model cannot rewrite these fields</text>
</g>
<g data-card="Intelligence · local evidence"><rect x="645" y="500" width="510" height="230" rx="18" fill="#f3e5f5" stroke="#20213f" stroke-width="2.5"/>
