<text x="670" y="584" class="body" text-anchor="start">Heading-aware README selection</text>
<text x="670" y="616" class="body" text-anchor="start">RAKE phrases + source spans</text>
<text x="670" y="648" class="body" text-anchor="start">Versioned profiles and hashes</text>
</g>
<g data-card="Organization · durable memory"><rect x="1215" y="500" width="510" height="230" rx="18" fill="#e3f2fd" stroke="#20213f" stroke-width="2.5"/>
<path d="M1229 504 Q1470.0 499 1710 504" fill="none" stroke="#673ab7" stroke-width="1" opacity=".35"/>
<text x="1239" y="544" class="card-title" text-anchor="start">Organization · durable memory</text>
<text x="1240" y="584" class="body" text-anchor="start">Canonical IDs, aliases and rules</text>
<text x="1240" y="616" class="body" text-anchor="start">USER decisions and rejections</text>
<text x="1240" y="648" class="body" text-anchor="start">Receipts, proposals and fences</text>
</g>
