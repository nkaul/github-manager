<!doctype html>
<html lang="en"><meta charset="utf-8"><title>GitHub Manager · complete illustrated companion</title>
<style>
@font-face{font-family:Ink;src:url('file:///System/Library/Fonts/Supplemental/Chalkboard.ttc')}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#fff}svg{display:block}text{font-family:Ink,'Chalkboard',sans-serif}text.small{font-family:Arial,sans-serif}#stage{background:radial-gradient(ellipse at 15% 10%,#f7f5ff66,transparent 47%),radial-gradient(ellipse at 90% 80%,#e8f5ff66,transparent 40%),#fff}
</style>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><g id="scene"></g></svg>
<script>
const ROOT=new URL('../../../',location.href);
const asset=p=>new URL(p,ROOT).href;
const files={overview:asset('eval/ai-system-design/publication/figures/01-evidence-to-decisions.png'),phases:asset('eval/ai-system-design/publication/v2/figures/01-two-ai-phases.png'),data:asset('eval/ai-system-design/publication/v2/figures/02-data-through-classification.png'),zen:asset('docs/design/logo-variants-20261013/animated-v2/zen-loop-orbit-poster.png')};
const C={ink:'#182544',blue:'#1e69d6',indigo:'#3949ab',purple:'#7e57c2',light:'#e3f2fd',lav:'#eee9ff',green:'#166d5b',mint:'#e2f3ed',gray:'#edf0f7',muted:'#5f6b85'};
let timeline,now=0,scene,local=0,uid=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-(1-x)**3};
const lerp=(a,b,p)=>a+(b-a)*p;
const progress=(start,duration=.85)=>ease((local-start)/duration);
const cue=(text,fallback)=>{if(scene.cues?.[text]!==undefined)return scene.cues[text]-scene.start;const w=timeline.words?.find(w=>w.scene===scene.id&&w.word.toLowerCase().replace(/[^a-z0-9]/g,'')===text.toLowerCase());return w?w.start-scene.start:fallback};
function txt(x,y,s,size=42,fill=C.ink,anchor='start',cls=''){return `<text data-label="${esc(s)}" x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" class="${cls}">${esc(s)}</text>`}
function lines(x,y,arr,size=40,gap=55,fill=C.ink,anchor='start'){return arr.map((s,i)=>txt(x,y+i*gap,s,size,fill,anchor)).join('')}
function box(x,y,w,h,fill='#fff',stroke=C.ink,sw=3){return `<path d="M${x+16},${y+2} Q${x+w*.45},${y-3} ${x+w-15},${y+1} Q${x+w+2},${y+2} ${x+w},${y+20} L${x+w-2},${y+h-19} Q${x+w},${y+h+1} ${x+w-18},${y+h} L${x+18},${y+h+2} Q${x-3},${y+h} ${x+1},${y+h-18} L${x},${y+18} Q${x-1},${y+1} ${x+16},${y+2}Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/><path d="M${x+23},${y+6} Q${x+w*.5},${y+1} ${x+w-24},${y+5}" fill="none" stroke="${stroke}" stroke-width="1.4" opacity=".3"/>`}
function wash(x,y,w,h,color=C.lav,p=1){return `<path d="M${x},${y+h*.2} Q${x+w*.3},${y-7} ${x+w*p},${y+2} L${x+w*p-6},${y+h-2} Q${x+w*.5},${y+h+7} ${x-3},${y+h-4}Z" fill="${color}"/>`}
function reveal(content,p,dx=0,dy=26){return `<g opacity="${clamp(p)}" transform="translate(${dx*(1-p)} ${dy*(1-p)})">${content}</g>`}
function group(content,x=0,y=0,scale=1,rot=0,opacity=1){return `<g opacity="${opacity}" transform="translate(${x} ${y}) scale(${scale}) rotate(${rot})">${content}</g>`}
function arrow(x1,y1,x2,y2,p=1,color=C.blue,bend=0,dashed=false){p=clamp(p);const cx=(x1+x2)/2,cy=(y1+y2)/2+bend;const x=(1-p)**2*x1+2*(1-p)*p*cx+p*p*x2,y=(1-p)**2*y1+2*(1-p)*p*cy+p*p*y2;const angle=Math.atan2(y-(lerp(y1,cy,p)),x-(lerp(x1,cx,p)));return `<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" pathLength="100" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${dashed?'10 10':'100'}" ${dashed?'':`stroke-dashoffset="${100*(1-p)}"`}/>${p>.1?`<path d="M${x-18*Math.cos(angle-.5)},${y-18*Math.sin(angle-.5)} L${x},${y} L${x-18*Math.cos(angle+.5)},${y-18*Math.sin(angle+.5)}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"/>`:''}`}
function icon(type,x,y,s=1,color=C.indigo){let d='';if(type==='folder')d='<path d="M3 13 L3 43 Q3 48 9 48 L53 48 Q58 48 58 42 L58 13 L31 13 L26 6 L8 6 Q3 6 3 13Z"/>';else if(type==='tag')d='<path d="M5 9 L30 9 L54 32 L31 55 L5 29Z"/><circle cx="16" cy="20" r="3" fill="white"/>';else if(type==='check')d='<circle cx="29" cy="29" r="25"/><path d="M14 29 L24 39 L44 18" stroke="white" fill="none" stroke-width="5"/>';else if(type==='search')d='<circle cx="24" cy="24" r="18" fill="none"/><path d="M37 38 L56 57" fill="none" stroke-width="7"/>';else if(type==='code')d='<path d="M18 10 L4 29 L18 47 M40 10 L54 29 L40 47 M34 5 L25 53" fill="none"/>';else if(type==='star')d='<path d="M29 2 L37 20 L57 22 L42 36 L46 56 L29 45 L11 56 L15 36 L1 22 L21 19Z"/>';else if(type==='globe')d='<circle cx="29" cy="29" r="25" fill="none"/><ellipse cx="29" cy="29" rx="12" ry="25" fill="none"/><path d="M4 29 H54 M10 15 H48 M10 43 H48" fill="none"/>';else if(type==='receipt')d='<path d="M8 3 H49 V57 L42 52 L35 57 L28 52 L21 57 L14 52 L8 57Z" fill="white"/><path d="M18 15 H39 M18 25 H39 M18 35 H31" fill="none"/>';else if(type==='lock')d='<rect x="9" y="25" width="40" height="30" rx="6"/><path d="M17 26 V17 Q17 2 29 2 Q42 2 42 17 V26" fill="none"/>';else d='<circle cx="29" cy="29" r="23" fill="none"/><path d="M29 14 V30 L42 37" fill="none"/>';return `<g transform="translate(${x} ${y}) scale(${s})" stroke="${color}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" fill="${color}">${d}</g>`}
function card(x,y,w,h,label,opts={}){let a=Array.isArray(label)?label:[label];let c=box(x,y,w,h,opts.fill||'#fff',opts.stroke||C.ink);if(opts.icon)c+=icon(opts.icon,x+22,y+22,opts.iconScale||.8,opts.color||C.indigo);c+=lines(x+(opts.icon?83:26),y+(h-a.length*(opts.gap||44))/2+(opts.size||36)*.82,a,opts.size||36,opts.gap||44,opts.textColor||C.ink);if(opts.sub)c+=txt(x+26,y+h-19,opts.sub,24,C.muted,'start','small');return c}
function pill(x,y,w,label,fill=C.lav,size=31){return box(x,y,w,54,fill,'none')+txt(x+w/2,y+38,label,size,C.indigo,'middle')}
function crop(key,view,x,y,w,h){return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${view.join(' ')}" overflow="hidden" preserveAspectRatio="xMidYMid meet"><image href="${files[key]}" width="${key==='overview'?1942:1536}" height="${key==='overview'?809:1024}"/></svg>`}
function robot(x,y,w=230,h=280){const id='robot-clip-'+uid++;return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="1236 338 165 225" overflow="hidden"><defs><clipPath id="${id}"><path d="M1290 338 H1360 L1401 400 V550 H1236 V458 H1257 V397 L1282 383Z"/></clipPath></defs><image href="${files.overview}" width="1942" height="809" clip-path="url(#${id})"/></svg>`}
function person(x,y,w=390,h=310){const id='person-clip-'+uid++;return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="1452 305 450 290" overflow="hidden"><defs><clipPath id="${id}"><path d="M1500 305 H1902 V595 H1452 V510 L1490 475Z"/></clipPath></defs><image href="${files.overview}" width="1942" height="809" clip-path="url(#${id})"/></svg>`}
function repo(x,y,w=300,h=174,label='orion-api',fill='#fff'){return box(x,y,w,h,fill)+icon('code',x+20,y+24,.65)+txt(x+76,y+52,label,w<340?25:33)+txt(x+24,y+h-24,'README + metadata',w<340?24:28,C.muted)}
function travel(label,x1,y1,x2,y2,start,duration=1.4){const raw=(local-start)/duration;if(raw<0||raw>1.15)return '';const p=ease(raw),x=lerp(x1,x2,p),y=lerp(y1,y2,p)-65*Math.sin(Math.PI*p);const alpha=clamp(raw*5)*clamp((1.15-raw)*5);return group(pill(-45,-25,90,label,C.lav,25),x,y,1-.18*p,0,alpha)}
function spark(x,y,phase=0){return `<g stroke="${C.purple}" stroke-width="5" stroke-linecap="round" opacity="${.45+.45*Math.sin(phase)**2}"><path d="M${x-28},${y} l-14,-4 M${x},${y-28} l-3,-15 M${x+27},${y-15} l13,-9"/></g>`}
function ribbon(active){const labels=['Discover','Evidence','Vocabulary','Retrieve','Request','Review','Remember'];let out='';const x=130,w=232;labels.forEach((v,i)=>{out+=wash(x+i*w,925,205,48,i===active?C.lav:'#f5f6fa');out+=txt(x+i*w+102,959,v,30,i===active?C.indigo:C.muted,'middle');if(i<6)out+=txt(x+i*w+219,959,'›',35,'#a2acc3','middle')});return out}
function header(n,subtitle){return txt(96,65,'GITHUB MANAGER',26,C.indigo,'start','small')+txt(1820,65,`${String(n+1).padStart(2,'0')} / 08`,25,C.muted,'end','small')+txt(96,155,scene.heading,65,C.indigo)+wash(96,174,Math.min(1650,scene.heading.length*25),11,C.lav)+txt(98,227,subtitle,31,C.muted,'start','small')}
</script><script src="engine.js"></script></html>
