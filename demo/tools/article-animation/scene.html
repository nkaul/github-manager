window.setTimeline=value=>{timeline=value;window.seek(0)};
window.seek=t=>{if(!timeline)return;now=clamp(t,0,119.999);let i=timeline.segments.findIndex(s=>now>=s.start&&now<s.end);if(i<0)i=7;scene=timeline.segments[i];local=now-scene.start;uid=0;let body=scenes[i]();let opacity=clamp(local/.28)*clamp((scene.end-now)/.24);document.getElementById('scene').innerHTML=`<g opacity="${opacity}">${body}</g>`;window.frameState={time:now,scene:scene.id,index:i,local,cues:scene.cues};return window.frameState};
window.audit=()=>{const bad=[];document.querySelectorAll('text').forEach(el=>{const b=el.getBoundingClientRect();if(b.width&&b.height&&(b.left<36||b.right>1884||b.top<20||b.bottom>1055))bad.push({text:el.textContent,box:{x:b.x,y:b.y,width:b.width,height:b.height}})});return {bad,state:window.frameState,font:document.fonts.check('40px Ink'),imageCount:document.querySelectorAll('image').length}};
