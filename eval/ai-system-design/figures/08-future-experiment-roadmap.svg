<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
<title id="title">A measured route to stronger retrieval and generation</title><desc id="desc">Proposed experiments only. Preserve the current sparse baseline and every original evaluation record.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#3949ab" stroke-width="1.5"/></marker></defs>
<style>text {font-family: "Chalkboard SE", "Comic Sans MS", "Trebuchet MS", sans-serif; fill:#20213f} .title {font-size:43px;font-weight:700;fill:#3949ab} .subtitle {font-size:23px} .card-title {font-size:28px;font-weight:700;fill:#673ab7} .body {font-size:23px} .small {font-size:21px} .label {font-size:22px;fill:#3949ab} .metric {font-family:"Trebuchet MS",sans-serif;font-size:28px;font-weight:700}</style>
<rect width="1800" height="1080" fill="#fff"/>
<path d="M60 34 Q850 5 1730 34 L1734 112 Q840 98 58 116Z" fill="#e3f2fd" opacity=".55"/>
<text x="75" y="80" class="title">A measured route to stronger retrieval and generation</text>
<path d="M76 99 Q700 106 1718 99" fill="none" stroke="#673ab7" stroke-width="4" opacity=".7"/>
<text x="78" y="142" class="subtitle">Proposed experiments only. Preserve the current sparse baseline and every original evaluation record.</text>
<g data-card="A · Evidence correctness"><rect x="75" y="190" width="510" height="265" rx="18" fill="#e3f2fd" stroke="#20213f" stroke-width="2.5"/>
<path d="M89 194 Q330.0 189 570 194" fill="none" stroke="#673ab7" stroke-width="1" opacity=".35"/>
<text x="99" y="234" class="card-title" text-anchor="start">A · Evidence correctness</text>
<text x="100" y="274" class="body" text-anchor="start">Full-sentence, heading-aware packing</text>
<text x="100" y="306" class="body" text-anchor="start">Supplied-ID validation parity</text>
<text x="100" y="338" class="body" text-anchor="start">Negation and multilingual fixtures</text>
<text x="100" y="370" class="body" text-anchor="start">Numeric human rubric + adjudication</text>
<text x="100" y="402" class="body" text-anchor="start">Independent repository-level test</text>
<text x="100" y="434" class="body" text-anchor="start">split</text>
</g>
<g data-card="B · Retrieval ablations"><rect x="645" y="190" width="510" height="265" rx="18" fill="#f3e5f5" stroke="#20213f" stroke-width="2.5"/>
<path d="M659 194 Q900.0 189 1140 194" fill="none" stroke="#673ab7" stroke-width="1" opacity=".35"/>
<text x="669" y="234" class="card-title" text-anchor="start">B · Retrieval ablations</text>
<text x="670" y="274" class="body" text-anchor="start">Binary/count TF-IDF vs BM25</text>
<text x="670" y="306" class="body" text-anchor="start">Candidate caps + alias boost tuning</text>
<text x="670" y="338" class="body" text-anchor="start">Public-only dense bi-encoder trial</text>
<text x="670" y="370" class="body" text-anchor="start">Sparse+dense union with rank fusion</text>
<text x="670" y="402" class="body" text-anchor="start">ACL filters before and after retrieval</text>
</g>
<g data-card="C · Selective escalation"><rect x="1215" y="190" width="510" height="265" rx="18" fill="#e3f2fd" stroke="#20213f" stroke-width="2.5"/>
<path d="M1229 194 Q1470.0 189 1710 194" fill="none" stroke="#673ab7" stroke-width="1" opacity=".35"/>
<text x="1239" y="234" class="card-title" text-anchor="start">C · Selective escalation</text>
<text x="1240" y="274" class="body" text-anchor="start">At most one broader retrieval pass</text>
<text x="1240" y="306" class="body" text-anchor="start">Source-linked additional passages</text>
<text x="1240" y="338" class="body" text-anchor="start">Rerank only when candidate set large</text>
<text x="1240" y="370" class="body" text-anchor="start">Abstain if supporting evidence absent</text>
<text x="1240" y="402" class="body" text-anchor="start">No learned claim without held-out eval</text>
</g>
<path d="M585,320 L645,320" fill="none" stroke="#3949ab" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/>
<path d="M1155,320 L1215,320" fill="none" stroke="#3949ab" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/>
<g data-card="Promotion criteria · a constrained quality / cost frontier"><rect x="75" y="585" width="1650" height="220" rx="18" fill="#f3e5f5" stroke="#20213f" stroke-width="2.5"/>
<path d="M89 589 Q900.0 584 1710 589" fill="none" stroke="#673ab7" stroke-width="1" opacity=".35"/>
<text x="99" y="629" class="card-title" text-anchor="start">Promotion criteria · a constrained quality / cost frontier</text>
<text x="100" y="669" class="body" text-anchor="start">Report candidate recall, passage recall, ranking quality, exact-set accuracy, project false positives and abstentions.</text>
<text x="100" y="701" class="body" text-anchor="start">Measure end-to-end tokens, indexing amortization, latency, accepted labels and human correction effort.</text>
<text x="100" y="733" class="body" text-anchor="start">Adopt a component only when its independent gain justifies added dollars, operational burden and privacy exposure.</text>
<text x="100" y="765" class="body" text-anchor="start">Distributed DynamoDB / SQS correctness remains a separate production-readiness gate.</text>
</g>
<rect x="75" y="875" width="1650" height="104" rx="18" fill="#e3f2fd"/>
<text x="100" y="912" class="card-title" text-anchor="start">Engineering contribution: the contract around intelligence</text>
<text x="100" y="952" class="small" text-anchor="start">Ground decisions in bounded evidence, protect user memory, retain receipts and make cost and state changes auditable.</text>
<text x="75" y="1048" class="small" text-anchor="start">GitHub Manager · AI system design · October 14, 2026</text>
<text x="1725" y="1048" class="small" text-anchor="end">08</text>
</svg>